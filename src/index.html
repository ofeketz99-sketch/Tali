<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:" />
  <title>Tali</title>
  <script src="theme-boot.js"></script><!-- צבעי הערכה האחרונה לפני הציור הראשון -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="splash.css" />
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css" />
</head>
<body>
  <script src="splash.js"></script><!-- first in body: the intro overlay is in the very first paint -->
  <!-- Windows: שורת הכותרת של החלון, בצבעי הערכה (גרירה, לחיצה כפולה להגדלה). כפתורי החלון מעליה, מ־main.js -->
  <div id="titlebar" aria-hidden="true"><img src="logo.png" alt="" /><span>Tali</span></div>
  <aside id="sidebar">
    <div class="side-head">
      <div class="vault">
        <img class="app-logo" src="logo.png" alt="" />
        <div class="brand-text"><div class="brand">Tali</div><div id="vaultName">בחירת תיקייה</div></div>
      </div>
      <button id="btnPick" class="icon-btn" data-tip="החלפת תיקיית המסמכים" data-icon="vault"></button>
      <button id="btnSettings" class="icon-btn" data-tip="הגדרות (Ctrl+,)" data-icon="settings"></button>
      <button id="btnSidebarMin" class="icon-btn" data-tip="צמצום הסרגל הימני" data-icon="panelCollapse" aria-label="צמצום הסרגל הימני"></button>    </div>
    <div class="side-top">
      <button id="btnNote" type="button" class="primary btn-new" data-tip="מסמך חדש (Ctrl+N)" aria-label="מסמך חדש"><svg class="btn-new-waves" viewBox="0 0 176 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H86 C73 24 60 34 42 44 C20 57 7 69 0 79 Z" fill="#d9effa" opacity=".70"/><path d="M0 80 C14 51 27 46 46 50 C68 53 87 72 115 78 C138 82 160 80 176 80 Z" fill="#eaf5fa" opacity=".94"/></svg><span class="btn-new-icon" aria-hidden="true"><span data-icon="plus"></span></span><span class="side-note-label btn-new-label">מסמך חדש</span></button>
      <button id="btnFolder" class="icon-btn" data-tip="תיקייה חדשה (Ctrl+Shift+N)" data-icon="folderPlus"></button>
    </div>
    <div class="search-box">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="חיפוש בשם ובתוכן…" title="חיפוש בשם ובתוכן של כל המסמכים (Ctrl+Shift+F)" />
    </div>
    <div class="side-views" role="toolbar" aria-label="תצוגות">
      <button id="btnGraph" class="icon-btn" data-tip="גרף הקישורים (Ctrl+G)" data-icon="graph" aria-label="גרף הקישורים"></button>
      <button id="btnRecent" class="icon-btn" data-tip="מסמכים אחרונים (Ctrl+Shift+H)" data-icon="history" aria-label="מסמכים אחרונים"></button>
      <button id="btnTags" class="icon-btn" data-tip="תגיות" data-icon="tag" aria-label="תגיות"></button>
      <button id="btnTasks" class="icon-btn" data-tip="משימות להמשך ותיבות סימון (Ctrl+Shift+T)" data-icon="taskSection" aria-label="משימות להמשך ותיבות סימון"></button>
      <button id="btnGhosts" class="icon-btn" data-tip="מסמכי רפאים: קישורים למסמכים שעוד לא נוצרו" data-icon="ghost" aria-label="מסמכי רפאים"></button>
      <button id="btnFlagged" class="icon-btn" data-tip="מסמכים מסומנים בדגל: הצגה בסרגל" data-icon="flag" aria-label="מסמכים מסומנים בדגל" aria-pressed="false"></button>
    </div>
    <div id="flagged" hidden></div>
    <div class="tree-head" role="toolbar" aria-label="פעולות על העץ">
      <span class="tree-label">מסמכים</span>
      <button id="btnTreeFocus" class="icon-btn" data-tip="מיקוד: רק התיקייה של המסמך הפתוח (Ctrl+Shift+L)" data-icon="locate" aria-label="מיקוד על המסמך הפתוח"></button>
      <button id="btnTreeCollapse" class="icon-btn" data-tip="כיווץ כל התיקיות" data-icon="collapseAll" aria-label="כיווץ כל התיקיות"></button>
    </div>
    <div id="tree"></div>
    <div id="sidebarResize" role="separator" aria-orientation="vertical" aria-label="שינוי רוחב הסרגל" data-tip="גרירה: רוחב הסרגל · לחיצה כפולה: ברירת מחדל"></div>
  </aside>

  <main id="main">
    <div id="tabBar" role="tablist" aria-label="מסמכים פתוחים" hidden></div>
    <div id="toolbar"></div>
    <div id="panes"><div class="pane" id="pane0">
    <div class="home-bg" hidden aria-hidden="true">
      <svg class="home-waves" viewBox="0 0 1600 900" preserveAspectRatio="none" focusable="false">
        <g class="home-wave-layer home-wave-layer-a">
          <path d="M-180 160 C180 180 400 490 760 545 C1090 596 1270 280 1780 230 L1780 430 C1360 480 1110 790 720 700 C350 615 120 355 -180 390 Z" />
        </g>
        <g class="home-wave-layer home-wave-layer-b">
          <path d="M-190 350 C180 335 415 700 760 725 C1080 748 1275 400 1785 300 L1785 520 C1370 605 1100 920 700 850 C330 785 100 520 -190 550 Z" />
        </g>
        <g class="home-wave-layer home-wave-layer-c">
          <path d="M-210 430 C150 380 390 570 680 615 C990 662 1240 560 1785 90 L1785 270 C1330 650 1045 790 680 735 C320 680 115 535 -210 650 Z" />
        </g>
        <g class="home-wave-layer home-wave-layer-d">
          <path d="M-180 520 C170 470 390 620 690 675 C1040 740 1310 600 1780 215 L1780 365 C1345 760 1010 875 650 810 C300 748 95 640 -180 725 Z" />
        </g>
      </svg>
    </div>
    <div id="pageWrap">
      <div id="folderLoading" class="folder-loading" hidden role="status" aria-live="polite">
        <span class="folder-loading-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <strong>טוען את תיקיית המסמכים…</strong>
        <small>סורק מסמכים, קישורים וקבצים מצורפים</small>
      </div>
      <div id="empty" class="empty" aria-label="מסך הבית">
        <button id="btnPickBig" class="primary">בחירת תיקייה</button>
      </div>
      <div id="home" hidden aria-label="מסך הבית"></div>
      <div id="page" hidden>
        <button type="button" id="docTitle" data-tip="שינוי שם (F2)"></button>
        <div id="docMeta" hidden><span class="dm-folder" data-icon="folder"><span></span></span><span class="dm-date" data-icon="calendar"><span></span></span></div>
        <!-- המאפיינים מוצגים בלוח ההקשר (לשונית "מאפיינים"); context-panel.js מעביר את המיכל לשם -->
        <div id="propsHost" class="dc-props" hidden><textarea id="props" hidden spellcheck="false" title="מאפיינים (frontmatter)"></textarea></div>
        <div id="editor"></div>
        <textarea id="raw" hidden spellcheck="false"></textarea>
      </div>
      <aside id="docCtx" hidden></aside>
    </div>
    </div></div>
    <div id="statusBar"><span id="saveDot" aria-hidden="true"></span><span id="saveText"></span><div id="status"></div><span id="wordCount"></span></div>
  </main>

  <dialog id="dlg">
    <form method="dialog">
      <label id="dlgLabel"></label>
      <input id="dlgInput" autocomplete="off" />
      <menu>
        <button value="cancel">ביטול</button>
        <button value="ok" class="primary">אישור</button>
      </menu>
    </form>
  </dialog>

  <dialog id="patchNotesDialog" class="patch-notes-dialog" aria-labelledby="patchNotesTitle" dir="rtl">
    <div class="patch-notes-header">
      <h2 id="patchNotesTitle" dir="ltr">Patch Notes</h2>
      <button type="button" id="btnClosePatchNotes" class="icon-btn" data-icon="close" aria-label="סגירה"></button>
    </div>
    <p id="patchNotesSource" class="patch-notes-source"></p>
    <div id="patchNotesContent" class="patch-notes-content" aria-live="polite"></div>
  </dialog>


  <script src="../dist/renderer.js"></script>
</body>
</html>
