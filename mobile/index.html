<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f6f2ea" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:" />
  <title>Tali</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="m" data-view="list">
  <header id="mHead">
    <button id="mBack" class="m-icon-btn" type="button" aria-label="חזרה לרשימה"></button>
    <button id="mLogo" class="m-logo-button" type="button" aria-label="הגדרות וקבצים">
      <img class="m-logo" src="icon-192.png" alt="" />
      <span id="mLogoChevron" class="m-logo-chevron" aria-hidden="true"></span>
    </button>
    <button id="mTitle" type="button" class="m-title">Tali</button>
    <span id="mSaveDot" class="m-save-dot" data-state="saved" aria-hidden="true"></span>
    <button id="mSync" class="m-icon-btn" type="button" aria-label="סנכרון"><span id="mSyncIcon"></span><span id="mSyncCount" class="m-badge" hidden>0</span></button>
    <button id="mMenu" class="m-icon-btn" type="button" aria-label="תפריט"></button>
  </header>

  <section id="mListView">
    <!-- התקנה כאפליקציה: רק כשנפתח בדפדפן. אנדרואיד: beforeinstallprompt; אייפון: הסבר (שיתוף ← הוספה למסך הבית) -->
    <div id="mInstall" class="m-install" hidden>
      <span id="mInstallIcon" class="m-install-icon"></span>
      <div class="m-install-text"><strong>Tali כאפליקציה</strong><span id="mInstallHint"></span></div>
      <button id="mInstallBtn" type="button" class="m-install-btn"></button>
      <button id="mInstallClose" type="button" class="m-icon-btn" aria-label="לא עכשיו"></button>
    </div>
    <div class="m-list-tools">
      <button id="mCapture" type="button" class="m-capture"><span id="mCaptureIcon"></span><span>מסמך חדש</span></button>
      <label class="m-search"><span id="mSearchIcon"></span><input id="mSearch" type="search" placeholder="חיפוש…" enterkeyhint="search" /></label>
    </div>
    <div id="mCrumb" class="m-crumb" hidden><button id="mCrumbUp" type="button" class="m-icon-btn" aria-label="תיקייה למעלה"></button><span id="mCrumbText"></span></div>
    <div id="mList" class="m-list"></div>
  </section>

  <section id="mNoteView">
    <div id="pageWrap">
      <div id="page">
        <div id="propsHost"><textarea id="props" hidden spellcheck="false"></textarea></div>
        <div id="editor"></div>
      </div>
      <textarea id="raw" hidden spellcheck="false" dir="auto"></textarea>
    </div>
    <nav id="mTools" aria-label="עיצוב"></nav>
  </section>

  <dialog id="mSheet" class="m-sheet">
    <div class="m-sheet-grip"></div>
    <div class="m-sheet-heading">
      <img src="icon-192.png" alt="" />
      <div><strong id="mSheetTitle">הגדרות וקבצים</strong><span id="mSheetSubtitle">תצוגה, סנכרון, ייבוא וייצוא</span></div>
    </div>
    <section id="mSheetNote">
      <h3>המסמך הזה</h3>
      <button id="mRename" type="button" class="m-sheet-item"><span data-icon="edit"></span>שינוי שם</button>
      <button id="mRaw" type="button" class="m-sheet-item"><span data-icon="markdown"></span>תצוגה מעוצבת / Markdown</button>
      <button id="mExport" type="button" class="m-sheet-item"><span data-icon="copy"></span>שיתוף הקובץ</button>
      <button id="mDelete" type="button" class="m-sheet-item danger"><span data-icon="trash"></span>מחיקה</button>
    </section>
    <div id="mSheetControl">
      <section>
        <h3>תצוגה</h3>
        <button id="mAppearanceOpen" type="button" class="m-sheet-item m-sheet-item-rich">
          <span data-icon="palette"></span><span><strong>עיצוב ותצוגה</strong><small id="mAppearanceSummary"></small></span><span id="mAppearanceChevron" class="m-item-chevron"></span>
        </button>
      </section>
      <section>
        <h3>סנכרון</h3>
        <p id="mSheetSync" class="m-muted"></p>
        <button id="mDriveConnect" type="button" class="m-sheet-item"><span id="mDriveIcon"></span>חיבור ל־Google Drive</button>
        <button id="mDriveDisconnect" type="button" class="m-sheet-item" hidden><span data-icon="unlink"></span>ניתוק מ־Google Drive</button>
      </section>
      <section>
        <h3>ייבוא וייצוא</h3>
        <label class="m-sheet-item"><span data-icon="filePlus"></span>ייבוא מסמכים ותמונות<input id="mImportFiles" type="file" multiple accept=".md,.canvas,image/*" hidden /></label>
        <label class="m-sheet-item"><span data-icon="folder"></span>ייבוא תיקייה שלמה<input id="mImportDir" type="file" webkitdirectory multiple hidden /></label>
        <button id="mExportAll" type="button" class="m-sheet-item"><span data-icon="exportPdf"></span>ייצוא גיבוי של כל התוכן</button>
        <label class="m-sheet-item"><span data-icon="archiveRestore"></span>שחזור מגיבוי Tali<input id="mImportBackup" type="file" accept=".json,application/json" hidden /></label>
      </section>
      <section id="mSheetApp">
        <h3>אפליקציה</h3>
        <button id="mInstallItem" type="button" class="m-sheet-item"><span id="mInstallItemIcon"></span>התקנה כאפליקציה</button>
      </section>
    </div>
    <button id="mSheetClose" type="button" class="m-sheet-close">סגירה</button>
  </dialog>

  <dialog id="mAppearance" class="m-sheet m-appearance">
    <div class="m-sheet-grip"></div>
    <div class="m-appearance-title"><button id="mAppearanceBack" type="button" class="m-icon-btn" aria-label="חזרה"></button><div><strong>עיצוב ותצוגה</strong><span>השינויים נשמרים במכשיר</span></div></div>
    <div class="m-preview" aria-hidden="true"><span class="m-preview-dot"></span><div><strong>כותרת מסמך</strong><span>טקסט לדוגמה</span></div></div>
    <section>
      <h3>ערכת צבעים</h3>
      <div id="mThemePresets" class="m-theme-presets"></div>
      <label class="m-color-row"><span><strong>צבע מודגש</strong><small>כפתורים, קישורים והדגשות</small></span><input id="mAccent" type="color" /></label>
    </section>
    <section>
      <h3>צפיפות הרשימה</h3>
      <div class="m-segment" role="group" aria-label="צפיפות הרשימה">
        <button id="mDensityComfortable" type="button" data-density="comfortable">כרטיסים</button>
        <button id="mDensityCompact" type="button" data-density="compact">רשימה קומפקטית</button>
      </div>
    </section>
    <section>
      <div class="m-setting-line"><label for="mFontSize">גודל הטקסט במסמך</label><output id="mFontSizeValue"></output></div>
      <input id="mFontSize" class="m-range" type="range" min="15" max="22" step="1" />
    </section>
    <section>
      <h3>מרווח בין השורות</h3>
      <div class="m-segment" role="group" aria-label="מרווח בין השורות">
        <button type="button" data-leading="compact">צפוף</button>
        <button type="button" data-leading="comfortable">נוח</button>
        <button type="button" data-leading="airy">אוורירי</button>
      </div>
    </section>
    <button id="mAppearanceReset" type="button" class="m-sheet-item m-reset"><span data-icon="rotateCcw"></span>חזרה לברירת המחדל</button>
    <button id="mAppearanceDone" type="button" class="m-sheet-close">סגירה</button>
  </dialog>

  <dialog id="mAsk" class="m-sheet m-ask">
    <div class="m-sheet-grip"></div>
    <form method="dialog">
      <h3 id="mAskTitle"></h3>
      <input id="mAskInput" type="text" dir="auto" enterkeyhint="done" autocomplete="off" />
      <div class="m-ask-actions">
        <button id="mAskCancel" type="button" class="m-ask-btn">ביטול</button>
        <button id="mAskOk" type="submit" class="m-ask-btn primary"></button>
      </div>
    </form>
  </dialog>

  <dialog id="mPicker" class="m-sheet m-picker">
    <div class="m-sheet-grip"></div>
    <h3>איפה הכספת ב־Google Drive?</h3>
    <div class="m-crumb"><button id="mPickerUp" type="button" class="m-icon-btn" aria-label="תיקייה למעלה"></button><span id="mPickerPath"></span></div>
    <div id="mPickerList" class="m-picker-list"></div>
    <div class="m-ask-actions">
      <button id="mPickerCancel" type="button" class="m-ask-btn">ביטול</button>
      <button id="mPickerChoose" type="button" class="m-ask-btn primary"></button>
    </div>
  </dialog>

  <div id="mToast" class="m-toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
