# בונה את Tali כקובץ התקנה וכקובץ נייד ל־Windows על שרת של GitHub, בלי להתקין כלום במחשב.
# הרצה ידנית: לשונית Actions > "Build Windows" > Run workflow. התוצר מופיע בתחתית הריצה, תחת Artifacts.
# שחרור: דוחפים תג כמו v5.9.0 (git tag v5.9.0 && git push origin v5.9.0), והקבצים נוספים ל־Release.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run release:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: Tali-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/latest.json
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { ($_.Extension -in '.exe', '.blockmap', '.json') -or $_.Name -like 'latest*.yml' } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --title "Tali $env:GITHUB_REF_NAME" --generate-notes
