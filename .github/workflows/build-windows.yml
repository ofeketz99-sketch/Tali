# בונה את Tali כקובץ התקנה וכקובץ נייד ל־Windows על שרת של GitHub, בלי להתקין כלום במחשב.
# הרצה ידנית: לשונית Actions > "Build Windows" > Run workflow. התוצר מופיע בתחתית הריצה, תחת Artifacts.
# שחרור: דוחפים תג כמו v5.9.0 (git tag v5.9.0 && git push origin v5.9.0), והקבצים נוספים ל־Release.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [feat/make-exe]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx --yes electron-builder@25.1.8 --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Tali-windows
          path: |
            release/*.exe
            release/*.blockmap
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.exe --title "Tali ${{ github.ref_name }}" --generate-notes
