# בונה את Tali כקובץ התקנה וכקובץ נייד ל־Windows על שרת של GitHub, בלי להתקין כלום במחשב.
# פרסום גרסה מהדפדפן, בלי מחשב פיתוח: לשונית Actions > "Build Windows" > Run workflow > Run workflow.
#   הגרסה נלקחת מ־package.json (6.4.0 -> תג v6.4), והתג וה־Release נוצרים לבד.
#   כדי רק לבנות בלי לפרסם, מבטלים את הסימון "Publish a release" (הקבצים יופיעו תחת Artifacts).
# אפשרות נוספת: דוחפים תג כמו v6.4 (git tag v6.4 && git push origin v6.4).
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (version from package.json)'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run release:manifest
      # Artifacts רק בבנייה בלי פרסום: בפרסום הקבצים כבר ב־Release. (10.7: מכסת האחסון של Artifacts התמלאה
      # וההעלאה הפילה את כל הריצה לפני הפרסום.) שמירה ל־3 ימים, ותקלה כאן לא מפילה את הריצה.
      - uses: actions/upload-artifact@v4
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        continue-on-error: true
        with:
          retention-days: 3
          name: Tali-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/latest.json
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # בתג: שם התג. בהרצה ידנית: הגרסה מ־package.json, באותה צורה כמו tools/release-manifest.js
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = 'v' + ((Get-Content package.json -Raw | ConvertFrom-Json).version -replace '\.0$', '') }
          try { gh release view $tag *> $null } catch { }
          if ($LASTEXITCODE -eq 0) { Write-Error "Release $tag already exists. Raise the version in package.json first."; exit 1 }
          $assets = Get-ChildItem release -File | Where-Object { ($_.Extension -in '.exe', '.blockmap', '.json') -or $_.Name -like 'latest*.yml' } | ForEach-Object { $_.FullName }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Tali $tag" --generate-notes
